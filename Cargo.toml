# Retreat-Modules workspace: one crate per gameplay module, under crates/.
#
# Modules depend only on Bevy and on contract crates: the engine's retreat_engine_api and this
# repository's retreat_gameplay_api (never on retreat_engine itself, never on each other).
# All are pinned here once.
# retreat_engine_api comes from the public Retreat-Engine-3D repository; Cargo.lock pins the
# commit (`cargo update -p retreat_engine_api` picks up a newer one). Bevy must be the exact
# version the engine uses.

[workspace]
resolver = "3"
members = ["crates/retreat_module_spawner", "crates/retreat_module_orbit_camera", "crates/retreat_module_sfx", "crates/retreat_module_fox_walk", "crates/retreat_module_highscore", "crates/retreat_module_menu", "crates/retreat_module_players", "crates/retreat_module_arena", "crates/retreat_module_health", "crates/retreat_module_match", "crates/retreat_module_player_spawn", "crates/retreat_module_character_movement", "crates/retreat_module_third_person_camera", "crates/retreat_module_character_visuals", "crates/retreat_module_rifle", "crates/retreat_module_combat_hud", "crates/retreat_module_projectile_launcher", "crates/retreat_module_inventory", "crates/retreat_module_loot", "crates/retreat_module_account", "crates/retreat_module_areas", "crates/retreat_module_item_rolls", "crates/retreat_module_grid_inventory", "crates/retreat_module_equipment", "crates/retreat_module_town_chest", "crates/retreat_module_wallet", "crates/retreat_module_container_ui", "crates/retreat_gameplay_api", "crates/retreat_weapon_kit", "crates/retreat_manifest", "crates/retreat_resolver"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
bevy = "0.20.1"
retreat_engine_api = { git = "https://github.com/RetreatSoftware/Retreat-Engine-3D" }
retreat_gameplay_api = { path = "crates/retreat_gameplay_api" }
# What weapon modules do the same way (a library, not a module).
retreat_weapon_kit = { path = "crates/retreat_weapon_kit" }
# For `NetState` components (rolled back and replicated module state).
serde = { version = "1", features = ["derive"] }

# Same build profiles as the engine: Bevy is slow unoptimized.
# `debug = "line-tables-only"`: full debug info made each test binary carry a ~1 GB .pdb and
# `target/` reach 28 GB. Do not set it back to `true`.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
# No incremental caches: they were a third of `target/` (cargo uses only this workspace's profiles).
incremental = false

[profile.dev.package."*"]
opt-level = 3
debug = false
