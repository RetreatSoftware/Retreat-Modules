[package]
name = "retreat_module_spawner"
description = "Retreat module: `spawner.rain <count>` drops physics boxes from the sky (the first, demo module)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bevy.workspace = true
retreat_engine_api.workspace = true

# Module manifest v1 (schema in Retreat-Modules/CLAUDE.md and crates/retreat_manifest/src/manifest.rs);
# checked against the source by `cargo run -p retreat_manifest --bin check_manifests`.
[package.metadata.retreat]
manifest_version = 1
id = "spawner"
display_name = "Spawner"
summary = "Drops physics boxes from the sky."
plugin = "retreat_module_spawner::SpawnerModulePlugin"
commands = ["spawner.rain"]
requires = ["physics", "input"]
actions = ["rain"]
engine_api = "0.1"
targets = ["native", "wasm"]
