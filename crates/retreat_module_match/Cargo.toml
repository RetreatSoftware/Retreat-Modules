[package]
name = "retreat_module_match"
description = "Retreat module: a timed free-for-all match with a scoreboard, a winner and restart."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[dependencies]
bevy.workspace = true
retreat_engine_api.workspace = true
retreat_gameplay_api.workspace = true

# Module manifest (schema in Retreat-Modules/CLAUDE.md).
[package.metadata.retreat]
manifest_version = 1
id = "match"
display_name = "Match"
summary = "A timed free-for-all match: score, winner and restart, decided by the server."
plugin = "retreat_module_match::MatchModulePlugin"
commands = ["match.start", "match.end", "match.restart", "assert.match_running", "assert.match_finished", "assert.match_score", "assert.match_winner"]
requires = ["networking"]
engine_api = "0.1"
targets = ["native", "wasm"]
network_role = "both"
