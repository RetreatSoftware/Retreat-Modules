[package]
name = "retreat_module_combat_hud"
description = "Retreat module: combat and match HUD (crosshair, health, ammo, clock, scoreboard, kill feed)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[dependencies]
bevy.workspace = true
retreat_engine_api.workspace = true
retreat_gameplay_api.workspace = true

# Module manifest (schema in Retreat-Modules/CLAUDE.md).
[package.metadata.retreat]
manifest_version = 1
id = "combat_hud"
display_name = "Combat HUD"
summary = "On-screen combat readouts, match clock, scoreboard, winner and kill feed for this player."
plugin = "retreat_module_combat_hud::CombatHudModulePlugin"
commands = ["hud.scoreboard", "assert.hud_shown", "assert.hud_text"]
actions = ["hud_scoreboard"]
requires = ["audio", "input", "ui", "networking"]
engine_api = "0.1"
targets = ["native", "wasm"]
network_role = "client"
