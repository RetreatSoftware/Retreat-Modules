[package]
name = "retreat_module_spawner"
description = "Retreat module: `spawner.rain <count>` drops physics boxes from the sky (the first, demo module)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bevy.workspace = true
retreat_engine_api.workspace = true

# The module manifest, read by Retreat-Forge (later) to select and validate modules. Provisional
# schema, documented in Retreat-Modules/CLAUDE.md:
#   id            unique module id (snake_case)
#   display_name  shown in Forge
#   summary       one sentence
#   plugin        the Bevy plugin type a game adds
#   commands      command ids the module registers (each `area.verb`, unique across modules)
#   requires      engine capabilities it needs
#   engine_api    compatible retreat_engine_api version (semver requirement)
[package.metadata.retreat]
id = "spawner"
display_name = "Spawner"
summary = "Drops physics boxes from the sky."
plugin = "retreat_module_spawner::SpawnerModulePlugin"
commands = ["spawner.rain"]
requires = ["physics"]
engine_api = "0.1"
