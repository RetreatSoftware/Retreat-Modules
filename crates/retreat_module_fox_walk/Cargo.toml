[package]
name = "retreat_module_fox_walk"
description = "Retreat module: picks which animation clips a model plays from its speed (Survey, Walk, Run blend)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bevy.workspace = true
retreat_engine_api.workspace = true

# Module manifest (schema in Retreat-Modules/CLAUDE.md).
[package.metadata.retreat]
id = "fox_walk"
display_name = "Fox walk"
summary = "Chooses and blends idle, walk and run clips from a model's speed; the engine plays them."
plugin = "retreat_module_fox_walk::FoxWalkModulePlugin"
commands = ["fox.set_speed"]
requires = ["animation"]
engine_api = "0.1"
